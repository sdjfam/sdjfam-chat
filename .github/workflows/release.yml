name: Release SDJFAM Chat

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Create YouTube OAuth resource
        shell: powershell
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_OAUTH_JSON)) {
            throw "GitHub secret YOUTUBE_OAUTH_JSON ontbreekt."
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "youtube-oauth.json"),
            $env:YOUTUBE_OAUTH_JSON,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Check Twitch Client ID
        shell: powershell
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_TWITCH_CLIENT_ID)) {
            throw "GitHub secret VITE_TWITCH_CLIENT_ID ontbreekt."
          }

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "SDJFAM Chat v__VERSION__"
          releaseBody: |
            Nieuw in SDJFAM Chat v0.1.10:

            - TikTok JOIN: één actuele kijker, direct vervangen en na vijf seconden verborgen
            - TikTok gifts: afzender, echte giftnaam en aantal in Alerts & Gifts
            - Giftstreaks werken dezelfde regel bij zonder cumulatieve aantallen op te tellen
            - Onafhankelijke verwerking van gelijktijdige senders en giftstreaks
            - Gerichte TikTok JOIN- en giftdiagnostics voor de volgende livestream

            Twitch Channel Points blijven uitsluitend in chat. De echte TikTok-livecontrole
            volgt tijdens de volgende livestream; lokale tests en builds zijn geslaagd.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true