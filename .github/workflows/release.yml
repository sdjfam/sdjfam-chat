name: Release SDJFAM Chat

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Create YouTube OAuth resource
        shell: powershell
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_OAUTH_JSON)) {
            throw "GitHub secret YOUTUBE_OAUTH_JSON ontbreekt."
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "youtube-oauth.json"),
            $env:YOUTUBE_OAUTH_JSON,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Check Twitch Client ID
        shell: powershell
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_TWITCH_CLIENT_ID)) {
            throw "GitHub secret VITE_TWITCH_CLIENT_ID ontbreekt."
          }

      - name: Regression and security gate
        run: |
          npm run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build failed" }
          node --test tests/*.cjs tests/*.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }

      - name: Build and inspect Windows installers
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        run: |
          npm run tauri -- build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw "Production build failed" }
          powershell -ExecutionPolicy Bypass -File scripts/verify-windows-bundle.ps1

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "SDJFAM Chat v__VERSION__"
          releaseBody: |
            Nieuw in SDJFAM Chat v0.1.11:

            - TikTok helper wordt expliciet naast de app meegeleverd en offline gecontroleerd
            - YouTube beëindigde chatstreams stoppen; discovery wacht op een nieuwe actieve livechat
            - Twitch viewers worden direct na EventSub-herstel opnieuw opgehaald
            - Token-recovery, Channel Points, chat en TikTok gifts blijven behouden
            - Regressiontests, securitycheck en installercontrole vóór publicatie
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true