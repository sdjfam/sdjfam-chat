name: Release SDJFAM Chat

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to recover without changing latest"
        required: true
        type: choice
        options:
          - v0.1.11
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Create YouTube OAuth resource
        shell: powershell
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_OAUTH_JSON)) {
            throw "GitHub secret YOUTUBE_OAUTH_JSON ontbreekt."
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "youtube-oauth.json"),
            $env:YOUTUBE_OAUTH_JSON,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Check Twitch Client ID
        shell: powershell
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_TWITCH_CLIENT_ID)) {
            throw "GitHub secret VITE_TWITCH_CLIENT_ID ontbreekt."
          }

      - name: Regression and security gate
        run: |
          npm run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build failed" }
          node --test tests/*.cjs tests/*.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed" }

      - name: Build and inspect Windows installers
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        run: |
          npm run tauri -- build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { throw "Production build failed" }
          powershell -ExecutionPolicy Bypass -File scripts/verify-windows-bundle.ps1

      - name: Prepare historical release without changing latest
        if: github.event_name == 'workflow_dispatch'
        id: historical
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ inputs.release_tag }}';
            if (tag !== 'v0.1.11') throw new Error('Unsupported historical tag');
            const expected = '5ce55d2a0e63dcb96626f11ede9cd1a900beaa4f';
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
            let sha = ref.object.sha;
            if (ref.object.type === 'tag') {
              const {data: annotated} = await github.rest.git.getTag({...context.repo, tag_sha: sha});
              sha = annotated.object.sha;
            }
            if (sha !== expected) throw new Error('Historical tag changed; refusing release');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
              if (release.draft || release.prerelease) throw new Error('Conflicting release state');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.payload.repository.default_branch,
                name: 'SDJFAM Chat ' + tag,
                body: 'Historical repair release. The latest recommended update remains v0.1.13.',
                draft: false, prerelease: false, make_latest: 'false'
              })).data;
            }
            core.setOutput('release_id', String(release.id));

      - name: Build and publish Tauri release
        if: github.event_name != 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        with:
          releaseCommitish: ${{ github.event.repository.default_branch }}
          tagName: v__VERSION__
          releaseName: "SDJFAM Chat v__VERSION__"
          releaseBody: |
            Nieuw in SDJFAM Chat v0.1.13:

            - TikTok helper wordt expliciet naast de app meegeleverd en offline gecontroleerd
            - YouTube streamsluiting: oplopende backoff, verse live-discovery en hervatten vanaf de laatste cursor
            - Werkelijk offline chats stoppen; nieuwe livestreams worden automatisch ontdekt
            - Twitch EventSub herstelt de actuele status na frontendherstart zonder dubbele worker
            - Twitch viewers worden direct na EventSub-herstel opnieuw opgehaald
            - Token-recovery, Channel Points, chat en TikTok gifts blijven behouden
            - Regressiontests, securitycheck en installercontrole vóór publicatie
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Publish recovered v0.1.11 assets
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
        with:
          releaseId: ${{ steps.historical.outputs.release_id }}
          tagName: v0.1.11
          releaseName: "SDJFAM Chat v0.1.11"
          releaseBody: "Historical repair release v0.1.11. The latest recommended update remains v0.1.13."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
